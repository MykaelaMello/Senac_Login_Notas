<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário do aluno | Senac</title>
    <link rel="stylesheet" href="styles.css">
    <script src="notas.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <div class="logosenac">
                <img src="https://uploads.onecompiler.io/44xy8sbpe/1793644094524/senac-logo.png"
                    alt="Logo do Senac" width="180" height="180">
            </div>
            <h1>Cadastro de Notas</h1>
            <p class="subtitulo">Formulário de avaliação do aluno</p>
        </header>
        <form id="formAluno">
            <div class="campo">
                <label for="nome">Nome do aluno</label>
                <input id="nome" name="nome" type="text" placeholder="Digite o nome completo" required>
            </div>
            <div class="campo">
                <label for="matricula">Matrícula</label>
                <input id="matricula" name="matricula" type="text" placeholder="Digite sua matrícula" required>
            </div>
            <div class="campo">
                <label for="turma">Turma</label>
                <input id="turma" name="turma" type="text" placeholder="Digite sua turma" required>
            </div>

            <div class="campo">
                <label for="disciplina">Disciplina</label>
                <select id="disciplina" name="disciplina" required>
                    <option value="">Selecione uma disciplina</option>
                    <option>Engenharia de Software</option>
                    <option>Projeto Integrador</option>
                    <option>Frontend</option>
                    <option>Banco de Dados</option>
                </select>
            </div>

            <h2>Notas do aluno</h2>
            <div class="campo">
                <label for="nota1">Primeira nota</label>
                <input id="nota1" name="nota1" type="number" min="0" max="10" step="0.1" placeholder="Nota de 0 a 10" required>
            </div>
            <div class="campo">
                <label for="nota2">Segunda nota</label>
                <input id="nota2" name="nota2" type="number" min="0" max="10" step="0.1" placeholder="Nota de 0 a 10" required>
            </div>
            <div class="campo">
                <label for="nota3">Terceira nota</label>
                <input id="nota3" name="nota3" type="number" min="0" max="10" step="0.1" placeholder="Nota de 0 a 10" required>
            </div>

            <div class="botoes">
                <button type="submit">Calcular média</button>
                <button type="reset">Limpar</button>
                <button type="button" id="voltar">Voltar</button>
            </div>
            <div id="resultado" role="status"></div>
        </form>
        <footer>Aula de Web · Senac</footer>
    </main>
</body>
</html>
