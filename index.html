<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de login | Senac</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <div class="logosenac">
                <img src="https://uploads.onecompiler.io/44xy8sbpe/1793644094524/senac-logo.png"
                    alt="Logo do Senac" width="180" height="180">
            </div>
            <h1>Área de Login</h1>
            <p class="subtitulo">Informe seus dados para acessar</p>
        </header>
        <form id="formLogin">
            <div class="campo">
                <label for="login">E-mail</label>
                <input id="login" name="login" type="email" placeholder="Digite seu e-mail" autocomplete="username" required>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>

            <div class="botoes">
                <button type="submit" id="confirmar">Confirmar</button>
                <button type="button" id="cancelar">Cancelar</button>
                <button type="reset" id="limpar">Limpar</button>
            </div>
        </form>
        <p id="mensagem" role="status"></p>
        <p class="demonstracao">Acesso de teste: aluno@example.com / Senac123</p>
        <footer>Aula de Web · Senac</footer>
    </main>
</body>
</html>
